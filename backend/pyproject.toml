[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# typing.Dict/List/Optional are kept deliberately: the code must import cleanly
# on Python 3.9 as well (pydantic evaluates annotations at runtime).
ignore = ["E501", "B008", "SIM105", "SIM108", "UP006", "UP007", "UP035", "UP038"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["app"]
